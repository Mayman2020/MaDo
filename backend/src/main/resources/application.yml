# Docker Compose / container: use application.yml defaults (service hostname `postgres`, user mado).
# Host dev: use profile `local` (see application-local.yml) — same pattern as srs-project (postgres DB + schema-only app schema).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/madodb?currentSchema=kick_live}
    username: ${SPRING_DATASOURCE_USERNAME:mado}
    password: ${SPRING_DATASOURCE_PASSWORD:mado_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET search_path TO kick_live, public
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: kick_live
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    mixed: true
    init-sqls:
      - SET search_path TO kick_live, public
    baseline-on-migrate: true
    repair-on-migrate: true
    schemas: kick_live
    default-schema: kick_live
    create-schemas: true
  data:
    redis:
      host: redis
      port: 6379
      # JPA repositories live under com.mado.repository; none are Redis @RedisHash.
      # Disables noisy startup scan: "Could not safely identify store assignment..."
      repositories:
        enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET:change-me-super-secret-key-change-me-super-secret-key}
  access-token-expiry: 900000
  refresh-token-expiry: 604800000

minio:
  url: ${MINIO_URL:http://minio:9000}
  access-key: minioadmin
  secret-key: minioadmin
  bucket: mado-media

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

server:
  port: 8080

app:
  streaming:
    hls-base-url: ${HLS_PUBLIC_BASE_URL:http://localhost:8088/hls}
    rtmp-stat-url: ${RTMP_STAT_URL:http://127.0.0.1:8088/stat}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    public-web-url: ${PUBLIC_WEB_URL:http://localhost:4200}
    # Set in production and send as header X-Mado-Stream-Callback from nginx exec hooks
    callback-secret: ${STREAM_CALLBACK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: ${MAIL_HEALTH_CHECK_ENABLED:false}
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: mado-platform

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.1
  environment: ${SPRING_PROFILES_ACTIVE:development}
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info
